  <body>
    <div id="root"></div>
    <script>
      // Safety net: if the game's script never starts (e.g. an old copy of this page points at files
      // a newer deploy removed), reload once from the server instead of leaving a blank screen.
      setTimeout(function () {
        try {
          if (document.getElementById('root').childElementCount) return
          if (sessionStorage.getItem('durak-reloaded')) return
          sessionStorage.setItem('durak-reloaded', '1')
          location.reload()
        } catch (e) {}
      }, 6000)
    </script>
  </body>

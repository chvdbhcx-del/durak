[package]
name = "durak-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Durak rules and bots, compiled to WebAssembly for the game's background thinker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
